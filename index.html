<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mnemonic Solidifier</title>

<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-512.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">

<meta name="theme-color" content="#101114">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mnemonic">

<style>
    :root {
        --bg: #101114;
        --card: #191b20;
        --card2: #23262d;
        --text: #f5f5f5;
        --muted: #a6abb5;
        --accent: #8ea8ff;
        --success: #83d6a5;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .app { width: min(520px, 100%); }

    h1 {
        margin: 0;
        font-size: 2rem;
        text-align: center;
    }

    .subtitle {
        text-align: center;
        color: var(--muted);
        margin: 6px 0 24px;
    }

    .card {
        background: var(--card);
        border-radius: 22px;
        padding: 24px;
        box-shadow: 0 12px 35px rgba(0,0,0,.25);
    }

    .mode-buttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 24px;
    }

    button {
        font: inherit;
        border: 0;
        cursor: pointer;
        border-radius: 14px;
        padding: 14px 16px;
        transition: transform .08s ease, opacity .15s ease;
    }

    button:active { transform: scale(.98); }

    .mode {
        background: var(--card2);
        color: var(--muted);
    }

    .mode.active {
        background: var(--accent);
        color: #111;
        font-weight: 700;
    }

    .display {
        min-height: 210px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
    }

    #instruction {
        color: var(--muted);
        font-size: .95rem;
        min-height: 24px;
    }

    #note {
        font-size: 6rem;
        line-height: 1;
        font-weight: 800;
        margin: 14px 0;
        min-height: 96px;
    }

    #status {
        color: var(--muted);
        min-height: 24px;
    }

    .primary {
        width: 100%;
        margin-top: 8px;
        background: var(--accent);
        color: #111;
        font-weight: 750;
        font-size: 1.1rem;
    }

    .secondary {
        width: 100%;
        margin-top: 10px;
        background: var(--card2);
        color: var(--text);
    }

    .install {
        width: 100%;
        margin-top: 16px;
        background: var(--success);
        color: #111;
        font-weight: 750;
    }

    .ios-hint {
        display: none;
        margin-top: 16px;
        padding: 12px;
        border-radius: 12px;
        background: var(--card2);
        color: var(--muted);
        text-align: center;
        font-size: .88rem;
        line-height: 1.4;
    }

    .stats {
        display: flex;
        justify-content: space-between;
        margin-top: 18px;
        font-size: .88rem;
        color: var(--muted);
    }

    .pitch-grid {
        margin-top: 20px;
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 7px;
    }

    .pitch {
        background: var(--card2);
        color: var(--muted);
        padding: 9px 4px;
        text-align: center;
        border-radius: 9px;
        font-size: .85rem;
    }

    .pitch.used { color: var(--success); }

    .tiny {
        text-align: center;
        color: var(--muted);
        font-size: .8rem;
        margin-top: 18px;
    }

    @media(max-width: 420px) {
        #note { font-size: 5rem; }
    }
</style>
</head>

<body>

<div class="app">

    <h1>Mnemonic Solidifier</h1>
    <div class="subtitle">A small companion to Harmoniq</div>

    <div class="card">

        <div class="mode-buttons">
            <button class="mode active" id="hearMode">Hear → Name</button>
            <button class="mode" id="recallMode">Note → Recall</button>
        </div>

        <div class="display">
            <div id="instruction">Hear the mnemonic and identify its note.</div>
            <div id="note">?</div>
            <div id="status">Ready.</div>
        </div>

        <button class="primary" id="mainButton">Play Random Mnemonic</button>
        <button class="secondary" id="secondaryButton" style="display:none;">Reveal Note</button>

        <div class="stats">
            <span id="progress">0 / 12 this round</span>
            <span id="round">Round 1</span>
        </div>

        <div class="pitch-grid" id="pitchGrid"></div>

        <button class="install" id="installButton" style="display:none;">Install App</button>

        <div class="ios-hint" id="iosHint">
            On iPhone/iPad: tap <strong>Share</strong>, then <strong>Add to Home Screen</strong>.
        </div>

    </div>

    <div class="tiny">
        All 12 notes are presented once in a random order before reshuffling.
    </div>

</div>

<script>
const NOTES = [
    { note: "A",  file: "./A.wav"  },
    { note: "B",  file: "./B.wav"  },
    { note: "Bb", file: "./Bb.wav" },
    { note: "C",  file: "./C.wav"  },
    { note: "D",  file: "./D.wav"  },
    { note: "Db", file: "./Db.wav" },
    { note: "E",  file: "./E.wav"  },
    { note: "Eb", file: "./Eb.wav" },
    { note: "F",  file: "./F.wav"  },
    { note: "F#", file: "./Fs.wav" },
    { note: "G",  file: "./G.wav"  },
    { note: "G#", file: "./Gs.wav" }
];

let mode = "hear";
let bag = [];
let current = null;
let audio = null;
let completed = [];
let roundNumber = 1;

const noteDisplay = document.getElementById("note");
const statusDisplay = document.getElementById("status");
const instruction = document.getElementById("instruction");
const mainButton = document.getElementById("mainButton");
const secondaryButton = document.getElementById("secondaryButton");
const hearModeButton = document.getElementById("hearMode");
const recallModeButton = document.getElementById("recallMode");
const progressDisplay = document.getElementById("progress");
const roundDisplay = document.getElementById("round");
const pitchGrid = document.getElementById("pitchGrid");
const installButton = document.getElementById("installButton");
const iosHint = document.getElementById("iosHint");

function shuffle(array) {
    const a = [...array];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function refillBag() {
    bag = shuffle(NOTES);
    completed = [];
    updateGrid();
    updateStats();
}

function nextMnemonic() {
    if (bag.length === 0) {
        roundNumber++;
        refillBag();
    }
    current = bag.pop();
    return current;
}

function playCurrent() {
    if (!current) return;

    if (audio) {
        audio.pause();
        audio.currentTime = 0;
    }

    audio = new Audio(current.file);
    statusDisplay.textContent = "Playing…";

    audio.play()
        .then(() => {
            statusDisplay.textContent = "Listen carefully.";
        })
        .catch(() => {
            statusDisplay.textContent =
                "Couldn't play " + current.file + " — check the filename.";
        });

    audio.onended = () => {
        if (mode === "hear") {
            statusDisplay.textContent = "Recall the note before revealing it.";
        } else {
            statusDisplay.textContent = "Compare that with what you heard internally.";
        }
    };
}

function startHearTrial() {
    nextMnemonic();
    noteDisplay.textContent = "?";
    instruction.textContent = "Hear the mnemonic. What note does it belong to?";
    statusDisplay.textContent = "Listen carefully.";
    mainButton.textContent = "Play Again";
    mainButton.onclick = playCurrent;
    secondaryButton.textContent = "Reveal Note";
    secondaryButton.style.display = "block";
    secondaryButton.onclick = revealHearAnswer;
    playCurrent();
}

function revealHearAnswer() {
    if (!current) return;

    noteDisplay.textContent = current.note;
    statusDisplay.textContent =
        "Connect the mnemonic firmly with " + current.note + ".";
    completeCurrent();

    secondaryButton.textContent = "Next Mnemonic";
    secondaryButton.onclick = startHearTrial;
}

function startRecallTrial() {
    nextMnemonic();
    noteDisplay.textContent = current.note;
    instruction.textContent = "Hear the mnemonic internally before checking.";
    statusDisplay.textContent =
        "Can you hear your " + current.note + " mnemonic in your head?";
    mainButton.textContent = "Play Mnemonic";
    mainButton.onclick = checkRecall;
    secondaryButton.style.display = "none";
}

function checkRecall() {
    if (!current) return;

    playCurrent();
    completeCurrent();

    mainButton.textContent = "Play Again";
    mainButton.onclick = playCurrent;

    secondaryButton.textContent = "Next Note";
    secondaryButton.style.display = "block";
    secondaryButton.onclick = startRecallTrial;
}

function completeCurrent() {
    if (!current) return;

    if (!completed.includes(current.note)) {
        completed.push(current.note);
    }

    updateGrid();
    updateStats();
}

function updateStats() {
    progressDisplay.textContent = completed.length + " / 12 this round";
    roundDisplay.textContent = "Round " + roundNumber;
}

function buildGrid() {
    pitchGrid.innerHTML = "";

    NOTES.forEach(item => {
        const div = document.createElement("div");
        div.className = "pitch";
        div.dataset.note = item.note;
        div.textContent = item.note;
        pitchGrid.appendChild(div);
    });
}

function updateGrid() {
    document.querySelectorAll(".pitch").forEach(el => {
        el.classList.toggle("used", completed.includes(el.dataset.note));
    });
}

function setHearMode() {
    mode = "hear";

    hearModeButton.classList.add("active");
    recallModeButton.classList.remove("active");

    current = null;
    noteDisplay.textContent = "?";
    instruction.textContent = "Hear the mnemonic and identify its note.";
    statusDisplay.textContent = "Ready.";
    mainButton.textContent = "Play Random Mnemonic";
    mainButton.onclick = startHearTrial;
    secondaryButton.style.display = "none";
}

function setRecallMode() {
    mode = "recall";

    recallModeButton.classList.add("active");
    hearModeButton.classList.remove("active");

    current = null;
    noteDisplay.textContent = "—";
    instruction.textContent = "See a note and recall its mnemonic internally.";
    statusDisplay.textContent = "Ready.";
    mainButton.textContent = "Give Me a Note";
    mainButton.onclick = startRecallTrial;
    secondaryButton.style.display = "none";
}

hearModeButton.onclick = setHearMode;
recallModeButton.onclick = setRecallMode;

document.addEventListener("keydown", event => {
    if (event.code === "Space") {
        event.preventDefault();
        mainButton.click();
    }
    if (event.key.toLowerCase() === "r" &&
        secondaryButton.style.display !== "none") {
        secondaryButton.click();
    }
});

// Register the service worker for offline use.
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js")
            .catch(err => console.error("Service worker registration failed:", err));
    });
}

// Android / Chromium install prompt.
let deferredPrompt = null;

window.addEventListener("beforeinstallprompt", event => {
    event.preventDefault();
    deferredPrompt = event;
    installButton.style.display = "block";
});

installButton.addEventListener("click", async () => {
    if (!deferredPrompt) return;

    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    installButton.style.display = "none";
});

window.addEventListener("appinstalled", () => {
    installButton.style.display = "none";
});

// iPhone/iPad installation hint.
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone =
    window.matchMedia("(display-mode: standalone)").matches ||
    window.navigator.standalone === true;

if (isIOS && !isStandalone) {
    iosHint.style.display = "block";
}

buildGrid();
refillBag();
setHearMode();
</script>

</body>
</html>
