<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mnemonic Solidifier</title>

<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-512.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">

<meta name="theme-color" content="#101114">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mnemonic">

<style>
:root {
    --bg: #101114;
    --card: #191b20;
    --card2: #23262d;
    --text: #f5f5f5;
    --muted: #a6abb5;
    --accent: #8ea8ff;
    --success: #83d6a5;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.app { width: min(520px, 100%); }

h1 {
    margin: 0;
    font-size: 2rem;
    text-align: center;
}

.subtitle {
    text-align: center;
    color: var(--muted);
    margin: 6px 0 24px;
}

.card {
    background: var(--card);
    border-radius: 22px;
    padding: 24px;
    box-shadow: 0 12px 35px rgba(0,0,0,.25);
}

.mode-buttons {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 24px;
}

button {
    font: inherit;
    border: 0;
    cursor: pointer;
    border-radius: 14px;
    padding: 14px 12px;
    transition: transform .08s ease;
}

button:active { transform: scale(.97); }

.mode {
    background: var(--card2);
    color: var(--muted);
    font-size: .92rem;
}

.mode.active {
    background: var(--accent);
    color: #111;
    font-weight: 700;
}

.display {
    min-height: 195px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
}

#instruction {
    color: var(--muted);
    font-size: .95rem;
    min-height: 24px;
}

#note {
    font-size: 6rem;
    line-height: 1;
    font-weight: 800;
    margin: 14px 0;
    min-height: 96px;
}

#status {
    color: var(--muted);
    min-height: 24px;
}

.primary {
    width: 100%;
    margin-top: 8px;
    background: var(--accent);
    color: #111;
    font-weight: 750;
    font-size: 1.05rem;
}

.secondary {
    width: 100%;
    margin-top: 10px;
    background: var(--card2);
    color: var(--text);
}

.stats {
    display: flex;
    justify-content: space-between;
    margin-top: 18px;
    font-size: .88rem;
    color: var(--muted);
}

.listen-panel {
    display: none;
}

.listen-title {
    text-align: center;
    color: var(--muted);
    margin: 4px 0 16px;
}

.pitch-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 9px;
}

.pitch {
    background: var(--card2);
    color: var(--text);
    padding: 16px 6px;
    font-weight: 750;
    border-radius: 12px;
}

.pitch.playing {
    background: var(--accent);
    color: #111;
}

.install {
    width: 100%;
    margin-top: 16px;
    background: var(--success);
    color: #111;
    font-weight: 750;
}

.ios-hint {
    display: none;
    margin-top: 16px;
    padding: 12px;
    border-radius: 12px;
    background: var(--card2);
    color: var(--muted);
    text-align: center;
    font-size: .88rem;
}

.tiny {
    text-align: center;
    color: var(--muted);
    font-size: .8rem;
    margin-top: 18px;
}

@media(max-width: 420px) {
    #note { font-size: 5rem; }
    .mode { font-size: .82rem; padding: 13px 7px; }
}
</style>
</head>

<body>
<div class="app">

    <h1>Mnemonic Solidifier</h1>
    <div class="subtitle">A small companion to Harmoniq</div>

    <div class="card">

        <div class="mode-buttons">
            <button class="mode active" id="hearMode">Hear → Name</button>
            <button class="mode" id="recallMode">Note → Recall</button>
            <button class="mode" id="listenMode">Listen</button>
        </div>

        <div id="practicePanel">
            <div class="display">
                <div id="instruction">Hear the mnemonic and identify its note.</div>
                <div id="note">?</div>
                <div id="status">Ready.</div>
            </div>

            <button class="primary" id="mainButton">Play Random Mnemonic</button>
            <button class="secondary" id="secondaryButton" style="display:none;">Reveal Note</button>

            <div class="stats">
                <span id="progress">0 / 12 this round</span>
                <span id="round">Round 1</span>
            </div>
        </div>

        <div class="listen-panel" id="listenPanel">
            <div class="listen-title">Tap any note to hear its mnemonic</div>
            <div class="pitch-grid" id="pitchGrid"></div>
            <div id="listenStatus" class="listen-title" style="margin-top:16px;">Choose a note.</div>
        </div>

        <button class="install" id="installButton" style="display:none;">Install App</button>

        <div class="ios-hint" id="iosHint">
            On iPhone/iPad: tap <strong>Share</strong>, then <strong>Add to Home Screen</strong>.
        </div>

    </div>

    <div class="tiny">All 12 notes are used once in random practice before reshuffling.</div>

</div>

<script>
const NOTES = [
    { note: "A",  file: "./A.wav"  },
    { note: "B",  file: "./B.wav"  },
    { note: "Bb", file: "./Bb.wav" },
    { note: "C",  file: "./C.wav"  },
    { note: "D",  file: "./D.wav"  },
    { note: "Db", file: "./Db.wav" },
    { note: "E",  file: "./E.wav"  },
    { note: "Eb", file: "./Eb.wav" },
    { note: "F",  file: "./F.wav"  },
    { note: "F#", file: "./Fs.wav" },
    { note: "G",  file: "./G.wav"  },
    { note: "G#", file: "./Gs.wav" }
];

let mode = "hear";
let bag = [];
let current = null;
let audio = null;
let completed = [];
let roundNumber = 1;

const practicePanel = document.getElementById("practicePanel");
const listenPanel = document.getElementById("listenPanel");
const noteDisplay = document.getElementById("note");
const statusDisplay = document.getElementById("status");
const instruction = document.getElementById("instruction");
const mainButton = document.getElementById("mainButton");
const secondaryButton = document.getElementById("secondaryButton");
const hearModeButton = document.getElementById("hearMode");
const recallModeButton = document.getElementById("recallMode");
const listenModeButton = document.getElementById("listenMode");
const progressDisplay = document.getElementById("progress");
const roundDisplay = document.getElementById("round");
const pitchGrid = document.getElementById("pitchGrid");
const listenStatus = document.getElementById("listenStatus");
const installButton = document.getElementById("installButton");
const iosHint = document.getElementById("iosHint");

function shuffle(array) {
    const a = [...array];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function refillBag() {
    bag = shuffle(NOTES);
    completed = [];
    updateStats();
}

function nextMnemonic() {
    if (bag.length === 0) {
        roundNumber++;
        refillBag();
    }
    current = bag.pop();
    return current;
}

function updateStats() {
    progressDisplay.textContent = completed.length + " / 12 this round";
    roundDisplay.textContent = "Round " + roundNumber;
}

function completeCurrent() {
    if (current && !completed.includes(current.note)) {
        completed.push(current.note);
        updateStats();
    }
}

function stopAudio() {
    if (audio) {
        audio.pause();
        audio.currentTime = 0;
    }
    document.querySelectorAll(".pitch").forEach(el => el.classList.remove("playing"));
}

function playFile(item, onEnd) {
    stopAudio();
    audio = new Audio(item.file);

    audio.play().catch(() => {
        statusDisplay.textContent = "Couldn't play " + item.file;
        listenStatus.textContent = "Couldn't play " + item.file;
    });

    audio.onended = () => {
        if (onEnd) onEnd();
    };
}

// Hear → Name
function startHearTrial() {
    nextMnemonic();
    noteDisplay.textContent = "?";
    instruction.textContent = "Hear the mnemonic. What note does it belong to?";
    statusDisplay.textContent = "Listening…";
    mainButton.textContent = "Play Again";
    mainButton.onclick = () => playFile(current, () => {
        statusDisplay.textContent = "Recall the note, then reveal it.";
    });

    secondaryButton.style.display = "block";
    secondaryButton.textContent = "Reveal Note";
    secondaryButton.onclick = revealHearAnswer;

    playFile(current, () => {
        statusDisplay.textContent = "Recall the note, then reveal it.";
    });
}

function revealHearAnswer() {
    if (!current) return;
    noteDisplay.textContent = current.note;
    statusDisplay.textContent = current.note;
    completeCurrent();

    secondaryButton.textContent = "Next Mnemonic";
    secondaryButton.onclick = startHearTrial;
}

// Note → Recall
function startRecallTrial() {
    nextMnemonic();
    noteDisplay.textContent = current.note;
    instruction.textContent = "Hear your mnemonic internally before checking.";
    statusDisplay.textContent = "When ready, play the mnemonic.";
    mainButton.textContent = "Play Mnemonic";
    mainButton.onclick = checkRecall;
    secondaryButton.style.display = "none";
}

function checkRecall() {
    if (!current) return;

    statusDisplay.textContent = "Listening…";
    playFile(current, () => {
        statusDisplay.textContent = "Compare it with what you heard internally.";
        completeCurrent();
        secondaryButton.style.display = "block";
        secondaryButton.textContent = "Next Note";
        secondaryButton.onclick = startRecallTrial;
    });
}

// Listen mode
function buildListenGrid() {
    pitchGrid.innerHTML = "";

    NOTES.forEach(item => {
        const button = document.createElement("button");
        button.className = "pitch";
        button.type = "button";
        button.textContent = item.note;

        button.onclick = () => {
            stopAudio();
            button.classList.add("playing");
            listenStatus.textContent = "Playing " + item.note + "…";

            audio = new Audio(item.file);
            audio.play().catch(() => {
                listenStatus.textContent = "Couldn't play " + item.file;
                button.classList.remove("playing");
            });

            audio.onended = () => {
                button.classList.remove("playing");
                listenStatus.textContent = item.note;
            };
        };

        pitchGrid.appendChild(button);
    });
}

function activateTab(tab) {
    [hearModeButton, recallModeButton, listenModeButton]
        .forEach(btn => btn.classList.remove("active"));
    tab.classList.add("active");
}

function setHearMode() {
    stopAudio();
    mode = "hear";
    activateTab(hearModeButton);

    practicePanel.style.display = "block";
    listenPanel.style.display = "none";

    current = null;
    noteDisplay.textContent = "?";
    instruction.textContent = "Hear the mnemonic and identify its note.";
    statusDisplay.textContent = "Ready.";
    mainButton.textContent = "Play Random Mnemonic";
    mainButton.onclick = startHearTrial;
    secondaryButton.style.display = "none";
}

function setRecallMode() {
    stopAudio();
    mode = "recall";
    activateTab(recallModeButton);

    practicePanel.style.display = "block";
    listenPanel.style.display = "none";

    current = null;
    noteDisplay.textContent = "—";
    instruction.textContent = "See a note and recall its mnemonic internally.";
    statusDisplay.textContent = "Ready.";
    mainButton.textContent = "Give Me a Note";
    mainButton.onclick = startRecallTrial;
    secondaryButton.style.display = "none";
}

function setListenMode() {
    stopAudio();
    mode = "listen";
    activateTab(listenModeButton);

    practicePanel.style.display = "none";
    listenPanel.style.display = "block";
    listenStatus.textContent = "Choose a note.";
}

hearModeButton.onclick = setHearMode;
recallModeButton.onclick = setRecallMode;
listenModeButton.onclick = setListenMode;

// PWA service worker
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js")
            .catch(err => console.error("Service worker registration failed:", err));
    });
}

// Install prompt
let deferredPrompt = null;

window.addEventListener("beforeinstallprompt", event => {
    event.preventDefault();
    deferredPrompt = event;
    installButton.style.display = "block";
});

installButton.addEventListener("click", async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    installButton.style.display = "none";
});

window.addEventListener("appinstalled", () => {
    installButton.style.display = "none";
});

// iPhone/iPad install hint
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone =
    window.matchMedia("(display-mode: standalone)").matches ||
    window.navigator.standalone === true;

if (isIOS && !isStandalone) {
    iosHint.style.display = "block";
}

buildListenGrid();
refillBag();
setHearMode();
</script>
</body>
</html>
